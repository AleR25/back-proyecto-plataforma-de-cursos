spring:
  application:
    name: cursos

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:mysql://localhost:3306/courses
    username: root
    password: ${DBPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.MySQLDialect

